<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!-- Try patina's setup window (setup.go): what patina's installer asks, asked on Windows.
     Colours, fonts, pages and words come from patina-setup.json, which patina publishes;
     nothing here is fetched from anywhere but the launcher itself. -->
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The words are patina's own, in English and German: no browser translates them. -->
<meta name="google" content="notranslate">
<title>Try patina</title>
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #000; --panel: #0b0b0b; --raised: #161616; --line: #222; --muted: #888;
    --text: #ddd; --bright: #fff; --accent: #fff; --accent2: #aaa; --error: #f66;
    --ui: "Segoe UI", system-ui, sans-serif; --display: var(--ui); --mono: Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); font: 15px/1.5 var(--ui);
    display: flex; flex-direction: column; visibility: hidden;
  }
  body.ready { visibility: visible; }
  header { display: flex; align-items: center; gap: 16px; padding: 22px 32px 18px; }
  header img { width: 44px; height: 44px; }
  h1 { font: 600 24px/1.2 var(--display); margin: 0; color: var(--bright); letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; color: var(--muted); }
  .version { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding: 0 32px 24px; scrollbar-color: var(--raised) var(--bg); }
  section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 20px 18px; margin-top: 12px;
  }
  section[hidden] { display: none; }
  h2 { font: 600 17px/1.3 var(--display); margin: 0 0 4px; color: var(--bright); }
  .note { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
  h2 + .cards { margin-top: 10px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 18px; }
  .fields.pairs { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  input, select {
    font: 15px var(--ui); color: var(--bright); background: var(--raised);
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; width: 100%;
  }
  input:focus-visible, select:focus-visible, button:focus-visible, .card:focus-within {
    outline: 2px solid var(--accent2); outline-offset: 2px;
  }
  /* The installer's answers as compact rows: a radio or a box, the name, one line or two
     of what it brings. */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
  .card {
    position: relative; display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
    background: var(--raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; transition: border-color .15s, box-shadow .15s;
  }
  .card:hover { border-color: var(--accent2); }
  .card:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 14px -6px var(--accent); }
  .card input { position: absolute; opacity: 0; pointer-events: none; }
  .card .tick {
    flex: none; width: 16px; height: 16px; margin-top: 2px; border-radius: 50%;
    border: 2px solid var(--muted); background: var(--bg);
  }
  .card .tick.box { border-radius: 4px; }
  .card:has(input:checked) .tick { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--bg); }
  .card .text { min-width: 0; }
  /* A theme shows its picture from the installer's theme page above the row. */
  .card.picture { display: block; padding: 0; overflow: hidden; }
  .card.picture img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--bg); }
  .card.picture .row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; }
  .card strong { display: block; color: var(--bright); font-weight: 600; line-height: 1.3; }
  .card span { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; margin-top: 2px; }
  footer {
    display: flex; align-items: center; gap: 12px; padding: 14px 32px;
    border-top: 1px solid var(--line); background: var(--bg);
  }
  #message { flex: 1; color: var(--error); min-height: 1.5em; }
  #message.done { color: var(--accent); }
  button {
    font: 600 15px var(--ui); border-radius: 10px; padding: 10px 20px; cursor: pointer;
    border: 1px solid var(--line); background: var(--raised); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <img src="icon.png" alt="">
  <div>
    <h1 data-t="title"></h1>
    <p data-t="lead"></p>
  </div>
</header>
<main>
  <form id="setup" autocomplete="off" novalidate>
    <section>
      <h2 data-t="account"></h2>
      <p class="note" data-t="accountNote"></p>
      <div class="fields pairs">
        <label class="field"><span data-t="fullname"></span><input id="fullname" maxlength="100"></label>
        <label class="field"><span data-t="user"></span><input id="user" maxlength="32" spellcheck="false"></label>
        <label class="field"><span data-t="password"></span><input id="password" type="password"></label>
        <label class="field"><span data-t="repeat"></span><input id="repeat" type="password"></label>
      </div>
    </section>
    <section>
      <h2 data-t="region"></h2>
      <p class="note" data-t="regionNote"></p>
      <div class="fields">
        <label class="field"><span data-t="locale"></span><select id="locale"></select></label>
        <label class="field"><span data-t="keyboard"></span><select id="keyboard"></select></label>
        <label class="field"><span data-t="timezone"></span><input id="timezone" list="timezones" spellcheck="false"></label>
      </div>
      <datalist id="timezones"></datalist>
    </section>
    <div id="pages"></div>
  </form>
</main>
<footer>
  <div id="message" role="status"></div>
  <button type="button" id="cancel" data-t="cancel"></button>
  <button type="submit" form="setup" class="primary" id="go" data-t="go"></button>
</footer>
<script>
"use strict";
const words = {
  en: {
    window: "Try patina", title: "Set up patina", lead: "Answer once; patina then starts and sets itself up.",
    account: "Your account", accountNote: "The name and password you log in to patina with. sudo asks for the same password.",
    fullname: "Your name", user: "Login name", password: "Password", repeat: "Password again",
    region: "Language, keyboard and time zone", regionNote: "Taken from Windows; change them if patina should differ.",
    locale: "Language", keyboard: "Keyboard", timezone: "Time zone",
    cancel: "Cancel", go: "Set up patina",
    short: "The password needs at least 8 characters.", differ: "The two passwords differ.",
    noUser: "Pick a login name.", sending: "One moment…",
    done: "Done. patina starts in a window of its own; you can close this one.",
    gone: "Try patina no longer answers; close this window and open Try patina again.",
  },
  de: {
    window: "Probiere patina auf Windows", title: "patina einrichten", lead: "Einmal beantworten; patina startet dann und richtet sich ein.",
    account: "Dein Konto", accountNote: "Name und Passwort, mit denen du dich bei patina anmeldest. sudo fragt nach demselben Passwort.",
    fullname: "Dein Name", user: "Anmeldename", password: "Passwort", repeat: "Passwort wiederholen",
    region: "Sprache, Tastatur und Zeitzone", regionNote: "Von Windows übernommen; ändere sie, wenn patina abweichen soll.",
    locale: "Sprache", keyboard: "Tastatur", timezone: "Zeitzone",
    cancel: "Abbrechen", go: "patina einrichten",
    short: "Das Passwort braucht mindestens 8 Zeichen.", differ: "Die beiden Passwörter unterscheiden sich.",
    noUser: "Wähle einen Anmeldenamen.", sending: "Einen Moment …",
    done: "Fertig. patina startet in einem eigenen Fenster; dieses kannst du schließen.",
    gone: "Try patina antwortet nicht mehr; schließe dieses Fenster und öffne Try patina erneut.",
  },
};
let t = words.en, de = false, setup = null, sent = false;
const $ = (id) => document.getElementById(id);
const say = (text, done) => { $("message").textContent = text; $("message").className = done ? "done" : ""; };
const pick = (item, key) => (de && item[key + "[de]"]) || item[key] || "";

// A login name from a full name: the first word, in small letters, as the installer does.
function loginFrom(name) {
  const first = name.trim().split(/\s+/)[0] || "";
  const plain = first.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  return plain.replace(/[^a-z0-9_-]/g, "").replace(/^[^a-z_]+/, "").slice(0, 32);
}

function option(select, value, text, selected) {
  const o = document.createElement("option");
  o.value = value; o.textContent = text; o.selected = selected;
  select.append(o);
}

function card(page, item, type, checked) {
  const label = document.createElement("label");
  label.className = "card";
  const input = document.createElement("input");
  input.type = type; input.name = page.id; input.value = item.id; input.checked = checked;
  input.addEventListener("change", update);
  const text = document.createElement("div");
  text.className = "text";
  const strong = document.createElement("strong");
  strong.textContent = pick(item, "name");
  const span = document.createElement("span");
  span.textContent = pick(item, "description");
  const tick = document.createElement("i");
  tick.className = type === "checkbox" ? "tick box" : "tick";
  text.append(strong, span);
  if (page.key === "PATINA_THEME" && item.picture) {
    label.classList.add("picture");
    const img = document.createElement("img");
    img.src = item.picture; img.alt = "";
    const row = document.createElement("div");
    row.className = "row";
    row.append(tick, text);
    label.append(input, img, row);
  } else {
    label.append(input, tick, text);
  }
  return label;
}

function render(data) {
  const d = data.defaults, p = data.palette || {}, f = data.fonts || {};
  de = d.german; t = de ? words.de : words.en;
  document.documentElement.lang = de ? "de" : "en";
  const css = document.documentElement.style;
  const colours = { bg: "base00", panel: "base01", raised: "base02", muted: "base04", text: "base05",
    bright: "base07", accent: "accent", accent2: "accent_alt", error: "base08" };
  for (const [name, key] of Object.entries(colours)) if (p[key]) css.setProperty("--" + name, p[key]);
  if (p.base02) css.setProperty("--line", p.base02);
  if (f.ui) css.setProperty("--ui", `"${f.ui}", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif`);
  if (f.display) css.setProperty("--display", `"${f.display}", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif`);
  if (f.monospace) css.setProperty("--mono", `"${f.monospace}", "Cascadia Mono", Consolas, monospace`);
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t[el.dataset.t];
  document.title = t.window;

  $("fullname").value = d.fullname || "";
  $("user").value = d.user || loginFrom(d.fullname || "");
  for (const l of d.locales) option($("locale"), l.id, l.name, l.id === d.locale);
  for (const k of d.keyboards) option($("keyboard"), k.id, k.name, k.id === d.keyboard);
  $("timezone").value = d.timezone;
  for (const z of d.timezones) { const o = document.createElement("option"); o.value = z; $("timezones").append(o); }

  for (const page of data.pages) {
    const section = document.createElement("section");
    section.id = "page-" + page.id;
    const h = document.createElement("h2");
    h.textContent = (de && page.labels["step[de]"]) || page.labels.step;
    section.append(h);
    const cards = document.createElement("div");
    cards.className = "cards";
    const multiple = page.mode === "optionalmultiple";
    const fallback = page.default || (page.items[0] && page.items[0].id);
    for (const item of page.items) {
      if (multiple && item.id === "") { // "nothing more": the page's note, not a choice
        const note = document.createElement("p");
        note.className = "note"; note.textContent = pick(item, "description");
        section.append(note);
        continue;
      }
      cards.append(card(page, item, multiple ? "checkbox" : "radio", !multiple && item.id === fallback));
    }
    section.append(cards);
    $("pages").append(section);
  }
  let typed = false;
  $("user").addEventListener("input", () => { typed = true; });
  $("fullname").addEventListener("input", () => { if (!typed) $("user").value = loginFrom($("fullname").value); });
  update();
  document.body.classList.add("ready");
  $("fullname").focus();
}

// The AI model page matters only with an agent, as the installer says on it.
function update() {
  const agent = document.querySelector('input[name="agent"]:checked');
  const ai = $("page-ai");
  if (ai) ai.hidden = !agent || agent.value === "none";
}

function answers() {
  const choices = {};
  for (const page of setup.pages) {
    choices[page.id] = [...document.querySelectorAll(`input[name="${page.id}"]:checked`)].map((i) => i.value);
  }
  return {
    fullname: $("fullname").value.trim(), user: $("user").value.trim(), password: $("password").value,
    locale: $("locale").value, keyboard: $("keyboard").value, timezone: $("timezone").value.trim(), choices,
  };
}

$("setup").addEventListener("submit", async (event) => {
  event.preventDefault();
  const a = answers();
  if (!a.user) return say(t.noUser);
  if ([...a.password].length < 8) return say(t.short);
  if (a.password !== $("repeat").value) return say(t.differ);
  $("go").disabled = true;
  say(t.sending);
  try {
    const reply = await fetch("submit", { method: "POST", body: JSON.stringify(a) });
    const body = await reply.json();
    if (!reply.ok) throw new Error(body.error);
    sent = true;
    say(t.done, true);
  } catch (err) {
    $("go").disabled = false;
    say(err.message || t.gone);
  }
});
$("cancel").addEventListener("click", () => { fetch("cancel", { method: "POST" }); window.close(); });
window.addEventListener("pagehide", () => { if (!sent) navigator.sendBeacon("cancel"); });
setInterval(() => fetch("alive", { method: "POST" }).catch(() => {}), 3000);
fetch("alive", { method: "POST" }).catch(() => {});

fetch("setup.json").then((r) => r.json()).then((data) => { setup = data; render(data); })
  .catch(() => { document.body.classList.add("ready"); say(t.gone); });
</script>
</body>
</html>
